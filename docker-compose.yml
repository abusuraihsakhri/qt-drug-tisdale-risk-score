version: '3.8'

services:
  qt-drug-tisdale-risk-score:
    build: .
    container_name: qt-drug-tisdale-risk-score
    ports:
      - "8000:8000"
    environment:
      - MODEL_PROVIDER=mock
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
