name: Tests and build

on:
  push:
    branches: [master, "audit/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest
      - name: Python syntax check
        run: python -m compileall -q tisdale_qt.py cli.py agents enrichment.py simulator.py tests
      - name: Run Python regression tests
        run: pytest -q
      - name: Verify CLI example
        run: |
          python tisdale_qt.py single --age 72 --sex female --loop-diuretic --potassium 3.4 --qtc 465 --no-acute-mi --heart-failure --num-qtdrugs 2 --no-sepsis > /tmp/tisdale.json
          python -c 'import json; d=json.load(open("/tmp/tisdale.json")); assert d["score"] == 16 and d["is_complete"]'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_browser.mjs
      - name: Confirm static entrypoint assets
        run: |
          test -f web/index.html
          test -f web/app.mjs
          test -f web/calculator.mjs
          grep -q 'src="./app.mjs"' web/index.html
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag tisdale-risk-score:test .
